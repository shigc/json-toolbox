name: Bug report
description: Report something that does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        For security vulnerabilities, use the **Security** tab instead of opening an issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the "JSON Compare" tool
        2. Paste the following input...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: JSON Toolbox version / commit
      placeholder: "e.g. 0.1.0 or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or sample data
      description: Paste any relevant logs. Remove sensitive data first.
    validations:
      required: false
