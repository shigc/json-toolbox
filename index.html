<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a66c2'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E" />
    <title>JSON Toolbox</title>
    <meta
      name="description"
      content="JSON Toolbox — 桌面软件风格的 JSON 工具箱，所有数据本地处理，不上传服务器。"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 挂载前先定主题，避免首屏闪白/闪黑
      try {
        var p = JSON.parse(localStorage.getItem('jsontoolbox.prefs') || '{}')
        var mode = p.theme || 'system'
        var dark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
